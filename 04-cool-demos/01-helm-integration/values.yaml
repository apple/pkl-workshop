# from https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/ci/05-server-deployment-values.yaml
server:
  clusterRoleNameOverride: "ci-prometheus-server-cluster-role"

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  env:
    - name: APPNAME
      value: prometheus

  extraArgs:
    query.timeout: 1m
    query.max-concurrency: 15

  persistentVolume:
    enabled: true
    size: 2Gi

  prefixURL: /prometheus

  retentionSize: 1GB

  startupProbe:
    enabled: true

  statefulSet:
    enabled: false

  tsdb:
    out_of_order_time_window: 10s
